name: Network Diagnostic

on:
    workflow_dispatch:
        inputs:
            download_megabytes:
                description: 'Download test size per round (MB)'
                required: true
                default: '25'
            upload_megabytes:
                description: 'Upload test size per round (MB)'
                required: true
                default: '10'
            duration_seconds:
                description: 'Soak / Twingate monitor duration (seconds)'
                required: true
                default: '60'
            include_twingate:
                description: 'Start the Twingate connector and monitor it'
                required: true
                default: true
                type: boolean
            publish_results:
                description: 'Commit the diagnostic logs and JSON to the repository'
                required: true
                default: true
                type: boolean

permissions:
    contents: write
    issues: write

concurrency:
    group: network-diagnostic
    cancel-in-progress: false

jobs:
    diagnose:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            TWINGATE_API_TOKEN: ${{ secrets.TWINGATE_API_TOKEN }}
            TWINGATE_ACCESS_TOKEN: ${{ secrets.TWINGATE_ACCESS_TOKEN }}
            TWINGATE_REFRESH_TOKEN: ${{ secrets.TWINGATE_REFRESH_TOKEN }}
            TWINGATE_NETWORK: ${{ vars.TWINGATE_NETWORK || secrets.TWINGATE_NETWORK || 'mikailamin' }}
            TWINGATE_ENABLED: auto
            TWINGATE_CONNECTOR_NAME: ${{ vars.TWINGATE_CONNECTOR_NAME || 'twingate-mccon' }}
            TWINGATE_DOCKER_PULL: ${{ vars.TWINGATE_DOCKER_PULL || 'always' }}
            TWINGATE_LABEL_HOSTNAME: ${{ vars.TWINGATE_LABEL_HOSTNAME || 'ultronsmp.net' }}
            TWINGATE_LABEL_DEPLOYED_BY: ${{ vars.TWINGATE_LABEL_DEPLOYED_BY || 'docker' }}
            TWINGATE_REMOTE_NETWORK: ${{ vars.TWINGATE_REMOTE_NETWORK }}
            TWINGATE_REMOTE_NETWORK_ID: ${{ vars.TWINGATE_REMOTE_NETWORK_ID }}
            TWINGATE_RESOURCE_NAME: ${{ vars.TWINGATE_RESOURCE_NAME || 'minecraft' }}
            TWINGATE_RESOURCE_ADDRESS: ${{ vars.TWINGATE_RESOURCE_ADDRESS || '127.0.0.1' }}
            TWINGATE_RESOURCE_ALIAS: ${{ vars.TWINGATE_RESOURCE_ALIAS || 'minecraft.ultronsmp.internal' }}
            TWINGATE_RESOURCE_PORT: ${{ vars.TWINGATE_RESOURCE_PORT || '25565' }}
            TWINGATE_RESOURCE_GROUP_NAMES: ${{ vars.TWINGATE_RESOURCE_GROUP_NAMES || 'Everyone' }}
        steps:
            - name: checkout_repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref_name }}

            - name: configure_git
              env:
                  GH_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  set -euo pipefail
                  git config user.name "ultron"
                  git config user.email "ultron@users.noreply.github.com"
                  gh auth setup-git

            - name: prepare_workspace
              run: |
                  set -euo pipefail
                  mkdir -p .agent-work/logs .agent-work/outputs .agent-work/tmp
                  {
                      echo "Runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown})"
                      echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                      uname -a
                  } | tee .agent-work/logs/issue-18-runner-info.log

            - name: tune_network
              continue-on-error: true
              run: |
                  set -euo pipefail
                  sudo bash scripts/network-tune.sh \
                      | tee .agent-work/logs/issue-18-network-tune.log

            - name: baseline_runner_speed
              env:
                  DOWNLOAD_MB: ${{ inputs.download_megabytes }}
                  UPLOAD_MB: ${{ inputs.upload_megabytes }}
                  DURATION_SECONDS: ${{ inputs.duration_seconds }}
              run: |
                  set -euo pipefail
                  download_bytes="$(python3 -c 'import os; print(int(float(os.environ["DOWNLOAD_MB"]) * 1000000))')"
                  upload_bytes="$(python3 -c 'import os; print(int(float(os.environ["UPLOAD_MB"]) * 1000000))')"
                  duration="$(python3 -c 'import os; print(int(float(os.environ["DURATION_SECONDS"])))')"

                  python3 scripts/network-diagnostic.py \
                      --label runner-baseline \
                      --download-bytes "$download_bytes" \
                      --upload-bytes "$upload_bytes" \
                      --bandwidth-rounds 3 \
                      --latency-probes 20 \
                      --soak-seconds "$duration" \
                      --soak-interval 5 \
                      --twingate-monitor-seconds 0 \
                      --json-output .agent-work/outputs/network-diagnostic-runner-baseline.json \
                      2>&1 | tee .agent-work/logs/issue-18-network-diagnostic-baseline.log

            - name: start_twingate_connector
              if: ${{ inputs.include_twingate }}
              continue-on-error: true
              run: |
                  set -euo pipefail
                  bash scripts/twingate-connector.sh start \
                      | tee .agent-work/logs/issue-18-twingate-connector-start.log

            - name: ensure_twingate_resource
              if: ${{ inputs.include_twingate }}
              continue-on-error: true
              run: |
                  set -euo pipefail
                  python3 scripts/twingate-resource.py ensure \
                      | tee .agent-work/logs/issue-18-twingate-resource.log

            - name: wait_for_twingate_connector
              if: ${{ inputs.include_twingate }}
              continue-on-error: true
              env:
                  DURATION_SECONDS: ${{ inputs.duration_seconds }}
              run: |
                  set -euo pipefail
                  duration="$(python3 -c 'import os; print(int(float(os.environ["DURATION_SECONDS"])))')"
                  if [ "$duration" -lt 30 ]; then
                      duration=30
                  fi

                  echo "Waiting up to ${duration}s for the connector to report online..."
                  for _ in $(seq 1 "$duration"); do
                      docker inspect --format '{{.State.Running}}' "${TWINGATE_CONNECTOR_NAME}" \
                          2>/dev/null || true
                      if python3 scripts/twingate-admin.py status 2>/dev/null \
                          | grep -Eq 'state=(ALIVE|ONLINE|HEALTHY|CONNECTED)'; then
                          echo "Connector is online."
                          break
                      fi
                      sleep 1
                  done

                  python3 scripts/twingate-admin.py status \
                      2>&1 | tee .agent-work/logs/issue-18-twingate-status-before.log || true
                  docker logs "${TWINGATE_CONNECTOR_NAME}" \
                      > .agent-work/logs/issue-18-twingate-connector.log 2>&1 || true
                  tail -n 80 .agent-work/logs/issue-18-twingate-connector.log || true

            - name: twingate_connector_speed
              if: ${{ inputs.include_twingate }}
              continue-on-error: true
              env:
                  DOWNLOAD_MB: ${{ inputs.download_megabytes }}
                  UPLOAD_MB: ${{ inputs.upload_megabytes }}
                  DURATION_SECONDS: ${{ inputs.duration_seconds }}
              run: |
                  set -euo pipefail
                  download_bytes="$(python3 -c 'import os; print(int(float(os.environ["DOWNLOAD_MB"]) * 1000000))')"
                  upload_bytes="$(python3 -c 'import os; print(int(float(os.environ["UPLOAD_MB"]) * 1000000))')"
                  duration="$(python3 -c 'import os; print(int(float(os.environ["DURATION_SECONDS"])))')"

                  python3 scripts/network-diagnostic.py \
                      --label twingate-connector-online \
                      --download-bytes "$download_bytes" \
                      --upload-bytes "$upload_bytes" \
                      --bandwidth-rounds 3 \
                      --latency-probes 20 \
                      --soak-seconds "$duration" \
                      --soak-interval 5 \
                      --twingate-monitor-seconds "$duration" \
                      --twingate-monitor-interval 10 \
                      --json-output .agent-work/outputs/network-diagnostic-twingate-connector-online.json \
                      2>&1 | tee .agent-work/logs/issue-18-network-diagnostic-twingate.log

            - name: collect_connector_evidence
              if: always() && inputs.include_twingate
              run: |
                  set -euo pipefail
                  docker logs "${TWINGATE_CONNECTOR_NAME}" \
                      > .agent-work/logs/issue-18-twingate-connector.log 2>&1 || true
                  docker stats --no-stream "${TWINGATE_CONNECTOR_NAME}" \
                      > .agent-work/logs/issue-18-twingate-docker-stats.log 2>&1 || true
                  python3 scripts/twingate-admin.py status \
                      2>&1 | tee .agent-work/logs/issue-18-twingate-status-after.log || true
                  {
                      echo "Connector online/error lines:"
                      grep -Ei 'online|offline|error|fatal|disconnect|reconnect|relay|state:' \
                          .agent-work/logs/issue-18-twingate-connector.log \
                          | tail -n 80 || true
                  } | tee .agent-work/logs/issue-18-twingate-log-summary.log

            - name: stop_twingate_connector
              if: always() && inputs.include_twingate
              run: |
                  set -euo pipefail
                  bash scripts/twingate-connector.sh stop || true

            - name: write_summary
              if: always()
              run: |
                  set -euo pipefail
                  {
                      echo "## Network diagnostic"
                      echo ""
                      echo "Runner: \`${RUNNER_NAME:-unknown}\`"
                      echo ""
                      echo "| Report | Verdict |"
                      echo "| --- | --- |"
                      python3 - <<'PY'
                  import glob
                  import json
                  import os

                  for path in sorted(glob.glob(".agent-work/outputs/network-diagnostic-*.json")):
                      with open(path, encoding="utf-8") as handle:
                          report = json.load(handle)
                      verdict = report.get("verdict", {})
                      bandwidth = report.get("bandwidth", {})
                      download = bandwidth.get("download", {})
                      upload = bandwidth.get("upload", {})
                      print(
                          "| {} | {} (down {} Mbps / up {} Mbps, stability {}, connector {}) |".format(
                              os.path.basename(path),
                              verdict.get("bandwidth", "?"),
                              download.get("mbps_avg", "?"),
                              upload.get("mbps_avg", "?"),
                              verdict.get("stability", "?"),
                              verdict.get("twingate_connector", "?"),
                          )
                      )
                  PY
                      echo ""
                      echo "The full logs and JSON reports are uploaded as the \`network-diagnostic\` artifact."
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            - name: upload_results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: network-diagnostic
                  path: |
                      .agent-work/logs/issue-18-*
                      .agent-work/outputs/network-diagnostic-*.json
                  if-no-files-found: ignore
                  retention-days: 30

            - name: commit_results
              if: always() && inputs.publish_results
              env:
                  GH_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  files=(.agent-work/logs/issue-18-* .agent-work/outputs/network-diagnostic-*.json)
                  if [ "${#files[@]}" -eq 0 ]; then
                      echo "No diagnostic files to publish."
                      exit 0
                  fi

                  git add "${files[@]}"
                  if git diff --cached --quiet; then
                      echo "Diagnostic files did not change."
                      exit 0
                  fi

                  git commit -m "Record network diagnostic results"

                  pushed=0
                  for _ in 1 2 3 4 5; do
                      if ! git fetch origin "$GITHUB_REF_NAME"; then
                          sleep 5
                          continue
                      fi
                      if git rebase "origin/$GITHUB_REF_NAME"; then
                          if git push origin "HEAD:$GITHUB_REF_NAME"; then
                              pushed=1
                              break
                          fi
                      else
                          git rebase --abort || true
                      fi
                      sleep 5
                  done

                  if [ "$pushed" -ne 1 ]; then
                      echo "ERROR: could not push the diagnostic results."
                      exit 1
                  fi
