name: Heads Plugin Test

on:
    workflow_dispatch:
    push:
        paths:
            - 'paper-plugin/**'
            - 'plugins/Heads-*.jar'
            - '.github/workflows/heads-plugin-test.yml'

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: checkout_repo
              uses: actions/checkout@v4

            - name: setup_java_25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - name: build_and_test
              env:
                  PAPER_TEST_DIR: ${{ runner.temp }}/heads-selftest
              run: bash paper-plugin/test.sh

            - name: upload_logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: heads-plugin-test-logs
                  path: |
                      .agent-work/logs/heads-build.log
                      .agent-work/logs/heads-selftest.log
                      .agent-work/logs/heads-test-run.log
                  if-no-files-found: ignore
