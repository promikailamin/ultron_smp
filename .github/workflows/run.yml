name: Run Paper Server

on:
    workflow_dispatch:
        inputs:
            paper_version:
                description: 'Paper version (blank = latest supported)'
                required: false
                default: ''
            paper_build:
                description: 'Paper build (blank = latest stable)'
                required: false
                default: ''
            connector:
                description: 'Minekube connector (gate = fastest, separate restartable process)'
                required: false
                default: gate
                type: choice
                options:
                    - gate
                    - plugin

permissions:
    contents: read

concurrency:
    group: paper-server
    cancel-in-progress: false

jobs:
    server:
        # Set the RUNNER_LABELS repository variable to a JSON array such as
        # ["self-hosted","linux","asia"] to run Paper on a VPS/runner near the
        # players. That is the only way to remove the physical US-runner RTT.
        runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
        timeout-minutes: 360
        env:
            MINEKUBE_ENDPOINT: ${{ vars.MINEKUBE_ENDPOINT || 'mikailamin' }}
            MINEKUBE_CONNECT_TOKEN: ${{ secrets.MINEKUBE_CONNECT_TOKEN }}
            MINEKUBE_ALLOW_OFFLINE: 'true'
            MINEKUBE_CONNECTOR: ${{ inputs.connector || 'gate' }}
            MINEKUBE_GATE_VERSION: ${{ vars.MINEKUBE_GATE_VERSION || 'latest' }}
            MINEKUBE_WATCH_HEALTH_ADDR: '127.0.0.1:25580'
            MINEKUBE_WATCH_URL: ${{ vars.MINEKUBE_WATCH_URL || '' }}
            MINEKUBE_FORCE_TUNNEL_SERVICE_ADDR: ${{ vars.MINEKUBE_FORCE_TUNNEL_SERVICE_ADDR || '' }}
            MINEKUBE_LIBP2P_EDGE_ADDR: ${{ vars.MINEKUBE_LIBP2P_EDGE_ADDR || '' }}
            MINEKUBE_LIBP2P_RELAY_ADDRS: ${{ vars.MINEKUBE_LIBP2P_RELAY_ADDRS || '' }}
            PAPER_VERSION: ${{ inputs.paper_version }}
            PAPER_BUILD: ${{ inputs.paper_build }}
            # Aikar-style G1 flags keep GC pauses short so keepalive/tick
            # handling is not delayed by multi-tens-of-ms collections.
            PAPER_JAVA_OPTS: >-
                -Xms2G -Xmx2G -XX:+UseG1GC -XX:+ParallelRefProcEnabled
                -XX:MaxGCPauseMillis=30 -XX:+UnlockExperimentalVMOptions
                -XX:+DisableExplicitGC -XX:G1NewSizePercent=30
                -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M
                -XX:G1ReservePercent=20 -XX:G1MixedGCCountTarget=4
                -XX:InitiatingHeapOccupancyPercent=15
                -XX:G1MixedGCLiveThresholdPercent=90
                -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32
                -XX:MaxTenuringThreshold=1 -XX:+PerfDisableSharedMem
            TWINGATE_ENABLED: ${{ vars.TWINGATE_ENABLED || 'auto' }}
            TWINGATE_NETWORK: ${{ vars.TWINGATE_NETWORK || secrets.TWINGATE_NETWORK || 'mikailamin' }}
            TWINGATE_CONNECTOR_NAME: ${{ vars.TWINGATE_CONNECTOR_NAME || 'twingate-mccon' }}
            TWINGATE_DOCKER_PULL: ${{ vars.TWINGATE_DOCKER_PULL || 'always' }}
            TWINGATE_LABEL_HOSTNAME: ${{ vars.TWINGATE_LABEL_HOSTNAME || 'ultronsmp.net' }}
            TWINGATE_LABEL_DEPLOYED_BY: ${{ vars.TWINGATE_LABEL_DEPLOYED_BY || 'docker' }}
            TWINGATE_ACCESS_TOKEN: ${{ secrets.TWINGATE_ACCESS_TOKEN }}
            TWINGATE_REFRESH_TOKEN: ${{ secrets.TWINGATE_REFRESH_TOKEN }}
            TWINGATE_API_TOKEN: ${{ secrets.TWINGATE_API_TOKEN }}
            TWINGATE_REMOTE_NETWORK: ${{ vars.TWINGATE_REMOTE_NETWORK }}
            TWINGATE_REMOTE_NETWORK_ID: ${{ vars.TWINGATE_REMOTE_NETWORK_ID }}
            TWINGATE_RESOURCE_NAME: ${{ vars.TWINGATE_RESOURCE_NAME || 'minecraft' }}
            TWINGATE_RESOURCE_ADDRESS: ${{ vars.TWINGATE_RESOURCE_ADDRESS || '127.0.0.1' }}
            TWINGATE_RESOURCE_ALIAS: ${{ vars.TWINGATE_RESOURCE_ALIAS || 'minecraft.ultronsmp.internal' }}
            TWINGATE_RESOURCE_PORT: ${{ vars.TWINGATE_RESOURCE_PORT || '25565' }}
            TWINGATE_RESOURCE_GROUP_NAMES: ${{ vars.TWINGATE_RESOURCE_GROUP_NAMES || 'Everyone' }}
        steps:
            - name: checkout_repo
              uses: actions/checkout@v4

            - name: setup_java_25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - name: tune_runner_network
              continue-on-error: true
              run: |
                  set -euo pipefail
                  mkdir -p .agent-work/logs
                  sudo bash scripts/network-tune.sh 2>&1 \
                      | tee .agent-work/logs/network-tune.log

            - name: tunnel_latency_baseline
              continue-on-error: true
              run: |
                  set -euo pipefail
                  mkdir -p .agent-work/logs .agent-work/outputs
                  python3 scripts/tunnel-latency.py \
                      --endpoint "${MINEKUBE_ENDPOINT}" \
                      --samples 8 \
                      --label before-server \
                      --json-out .agent-work/outputs/tunnel-latency-before-server.json \
                      2>&1 | tee .agent-work/logs/tunnel-latency-before-server.log

            - name: verify_connect_secret
              run: |
                  set -euo pipefail
                  if [ -z "${MINEKUBE_CONNECT_TOKEN:-}" ]; then
                      echo "ERROR: repository secret MINEKUBE_CONNECT_TOKEN is not set." >&2
                      exit 1
                  fi
                  echo "Minekube token secret is present (value not printed)."

            - name: start_twingate_connector
              # The script starts only when both connector tokens are present and
              # honours TWINGATE_ENABLED=false/true as an override. A Twingate
              # problem must never take down the public Minecraft tunnel.
              continue-on-error: true
              run: |
                  set -euo pipefail
                  mkdir -p .agent-work/logs
                  bash scripts/twingate-connector.sh start 2>&1 \
                      | tee .agent-work/logs/twingate-connector.log

            - name: ensure_twingate_resource
              # Connector tokens cannot create Resources, so this needs an Admin
              # API token. The script skips cleanly when none is configured and
              # never prints secret values.
              continue-on-error: true
              run: |
                  set -euo pipefail
                  mkdir -p .agent-work/logs
                  python3 scripts/twingate-resource.py ensure 2>&1 \
                      | tee .agent-work/logs/twingate-resource.log

            - name: run_server
              timeout-minutes: 350
              run: |
                  set -euo pipefail
                  mkdir -p .agent-work/logs .agent-work/tmp .agent-work/outputs
                  log=".agent-work/logs/server-run.log"
                  health_log=".agent-work/logs/tunnel-health.log"
                  fifo=".agent-work/tmp/server-input.fifo"
                  monitor_pid=""
                  rm -f "$fifo"
                  mkfifo "$fifo"

                  bash start.sh <"$fifo" >"$log" 2>&1 &
                  server_pid=$!
                  exec 3>"$fifo"

                  stop_server() {
                      if [ -n "$monitor_pid" ]; then
                          kill "$monitor_pid" 2>/dev/null || true
                          wait "$monitor_pid" 2>/dev/null || true
                      fi
                      if [ "${MINEKUBE_CONNECTOR:-plugin}" = "gate" ]; then
                          bash scripts/minekube-gate.sh stop >/dev/null 2>&1 || true
                      fi
                      bash scripts/twingate-connector.sh stop >/dev/null 2>&1 || true
                      if kill -0 "$server_pid" 2>/dev/null; then
                          echo "Stopping the Minecraft server..." >&2
                          echo "stop" >&3 2>/dev/null || true
                          for _ in $(seq 1 30); do
                              kill -0 "$server_pid" 2>/dev/null || break
                              sleep 1
                          done
                          kill "$server_pid" 2>/dev/null || true
                      fi
                      wait "$server_pid" 2>/dev/null || true
                      exec 3>&- 2>/dev/null || true
                      rm -f "$fifo"
                  }
                  trap stop_server EXIT
                  trap 'exit 143' TERM
                  trap 'exit 130' INT

                  ready=0
                  for _ in $(seq 1 300); do
                      if grep -q 'Done (' "$log" 2>/dev/null; then
                          ready=1
                          break
                      fi
                      if ! kill -0 "$server_pid" 2>/dev/null; then
                          break
                      fi
                      sleep 2
                  done

                  if [ "$ready" -ne 1 ]; then
                      echo "ERROR: the server did not become ready." >&2
                      tail -n 200 "$log" || true
                      exit 1
                  fi

                  echo "Minecraft server is ready."
                  if [ "${MINEKUBE_CONNECTOR:-plugin}" = "gate" ]; then
                      bash scripts/minekube-gate.sh start \
                          2>&1 | tee -a .agent-work/logs/minekube-gate-console.log
                      endpoint="${MINEKUBE_ENDPOINT:-}"
                      if [ -z "$endpoint" ]; then
                          endpoint="$(sed -n 's/^[[:space:]]*name:[[:space:]]*//p' \
                              .agent-work/tmp/minekube-gate/config.yml | head -n 1 | tr -d '"')"
                      fi
                      echo "Minekube Gate connector registered the endpoint successfully."
                  else
                      endpoint="$(sed -n 's/^endpoint:[[:space:]]*//p' plugins/connect/config.yml | head -n 1)"
                      if grep -q "Your public address: ${endpoint}.play.minekube.net" "$log"; then
                          echo "Minekube Connect registered the endpoint successfully."
                      else
                          echo "WARNING: could not find the Minekube registration line in the log." >&2
                          grep -i 'connect' "$log" | tail -n 20 || true
                      fi
                  fi

                  address="${endpoint}.play.minekube.net:25565"
                  printf '# Ultron SMP public address\n%s\n' "$address" > SERVER_ADDRESS.txt
                  echo "Minekube address: ${address}"

                  # Record the connector's watch-health state for the whole run so a
                  # slow/dropped server -> tunnel leg is visible instead of silent.
                  health_addr="${MINEKUBE_WATCH_HEALTH_ADDR:-127.0.0.1:25580}"
                  gate_pid_file="${RUNNER_TEMP:-$PWD/.agent-work/tmp}/ultron-gate.pid"
                  monitor_tunnel() {
                      while kill -0 "$server_pid" 2>/dev/null; do
                          if [ "${MINEKUBE_CONNECTOR:-plugin}" = "gate" ]; then
                              gate_pid="$(cat "$gate_pid_file" 2>/dev/null || true)"
                              if [ -n "$gate_pid" ] && kill -0 "$gate_pid" 2>/dev/null; then
                                  code="gate-running"
                              else
                                  code="gate-down"
                                  echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') restarting Gate" \
                                      >>.agent-work/logs/minekube-gate-restart.log
                                  bash scripts/minekube-gate.sh start \
                                      >>.agent-work/logs/minekube-gate-restart.log 2>&1 || true
                              fi
                          else
                              code="$(curl -fsS --max-time 3 \
                                  -o /dev/null -w '%{http_code}' \
                                  "http://${health_addr}/healthz" 2>/dev/null || echo unavailable)"
                          fi
                          printf '%s health=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$code" >>"$health_log"
                          sleep 30
                      done
                  }
                  monitor_tunnel &
                  monitor_pid=$!

                  python3 scripts/tunnel-latency.py \
                      --endpoint "${endpoint}" \
                      --samples 8 \
                      --label server-ready \
                      --json-out .agent-work/outputs/tunnel-latency-server-ready.json \
                      2>&1 | tee .agent-work/logs/tunnel-latency-server-ready.log || true

                  {
                      echo "## Ultron SMP is online"
                      echo ""
                      echo "**Minecraft address:** \`${address}\`"
                      echo ""
                      echo "**Paper:** latest downloaded build (see server log)"
                      echo "**Minekube endpoint:** \`${endpoint}\`"
                      echo "**Connector:** \`${MINEKUBE_CONNECTOR:-gate}\`"
                      if [ -n "${TWINGATE_RESOURCE_ALIAS:-}" ] \
                          && [ "${TWINGATE_RESOURCE_ALIAS}" != "none" ]; then
                          echo "**Twingate (low-ping/private):** \`${TWINGATE_RESOURCE_ALIAS}:${TWINGATE_RESOURCE_PORT:-25565}\`"
                      fi
                      echo ""
                      echo "### Tunnel path"
                      echo '```'
                      tail -n 14 .agent-work/logs/tunnel-latency-server-ready.log 2>/dev/null || true
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

                  # Wait for the server to exit (job timeout or manual stop).
                  wait "$server_pid"
                  if [ -n "$monitor_pid" ]; then
                      kill "$monitor_pid" 2>/dev/null || true
                      wait "$monitor_pid" 2>/dev/null || true
                  fi
                  rm -f "$fifo"
                  exec 3>&-
                  trap - EXIT

            - name: stop_twingate_connector
              if: always()
              run: |
                  set -euo pipefail
                  bash scripts/twingate-connector.sh stop || true

            - name: run_summary
              if: always()
              run: |
                  set -euo pipefail
                  if [ -f .agent-work/logs/server-run.log ]; then
                      echo "### Last server log lines" >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -n 40 .agent-work/logs/server-run.log >> "$GITHUB_STEP_SUMMARY" || true
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi
                  if [ -f .agent-work/logs/tunnel-health.log ]; then
                      echo "### Tunnel health samples" >> "$GITHUB_STEP_SUMMARY"
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                      tail -n 20 .agent-work/logs/tunnel-health.log >> "$GITHUB_STEP_SUMMARY" || true
                      echo '```' >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: upload_logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: paper-server-logs
                  path: |
                      .agent-work/logs/server-run.log
                      .agent-work/logs/setup-server.log
                      .agent-work/logs/network-tune.log
                      .agent-work/logs/tunnel-latency-before-server.log
                      .agent-work/logs/tunnel-latency-server-ready.log
                      .agent-work/logs/tunnel-health.log
                      .agent-work/logs/minekube-gate.log
                      .agent-work/logs/minekube-gate-console.log
                      .agent-work/logs/minekube-gate-restart.log
                      .agent-work/logs/twingate-connector.log
                      .agent-work/logs/twingate-resource.log
                      .agent-work/outputs/tunnel-latency-before-server.json
                      .agent-work/outputs/tunnel-latency-server-ready.json
                      SERVER_ADDRESS.txt
                  if-no-files-found: ignore
