name: Paper Economy Plugin Test

on:
    workflow_dispatch:
    push:
        paths:
            - 'paper-plugin/**'
            - 'paper/**'
            - 'config/economy/**'
            - '.github/workflows/paper-plugin-test.yml'

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            PAPER_TEST_DIR: ${{ github.workspace }}/.agent-work/tmp/paper-selftest-ci
        steps:
            - name: checkout_repo
              uses: actions/checkout@v4

            - name: setup_java_25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '25'

            - name: build_and_test
              run: bash paper-plugin/test.sh

            - name: upload_logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: paper-economy-test-logs
                  path: |
                      ${{ env.PAPER_TEST_DIR }}/paper-test.log
                      .agent-work/logs/issue-21-*.log
                  if-no-files-found: ignore
